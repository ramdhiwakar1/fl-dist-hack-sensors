[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensor-fl"
version = "1.0.0"
description = "Federated Learning for Industrial Pump Sensor Anomaly Detection"
license = {text = "Apache-2.0"}
dependencies = [
    "flwr[simulation]>=1.23.0,<2.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "streamlit>=1.28.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "sensormatic"

[tool.flwr.app.components]
serverapp = "server:app"
clientapp = "client:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-fit = 1.0

[tool.flwr.federations]
default = "local"

[tool.flwr.federations.local]
address = "127.0.0.1:9092"
insecure = true

[tool.flwr.federations.production]
address = "0.0.0.0:9092"
insecure = false
root-certificates = "certificates/ca.crt"

